  <path d="M128 98 Q136 94 144 98" fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="104" cy="108" r="3.5" fill="#0F172A"/>
  <circle cx="136" cy="108" r="3.5" fill="#0F172A"/>

  <!-- Smile -->
  <path d="M112 134 Q120 142 128 134" fill="none" stroke="#B45309" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Modern Tech Badge Pin (Server/Database icon) -->
  <circle cx="160" cy="180" r="14" fill="#3B82F6"/>
  <path d="M154 176 C154 174, 166 174, 166 176 C166 178, 154 178, 154 176 Z M154 180 C154 178, 166 178, 166 180 C166 182, 154 182, 154 180 Z M154 184 C154 182, 166 182, 166 184 C166 186, 154 186, 154 184 Z" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
</svg>
