<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="p1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="p1-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="p1-hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="120" cy="120" r="110" fill="url(#p1-bg)" opacity="0.15"/>
  <circle cx="120" cy="120" r="100" fill="url(#p1-bg)" opacity="0.25"/>

  <!-- Body / Shoulders -->
  <path d="M60 210 C60 170, 85 160, 120 160 C155 160, 180 170, 180 210 Z" fill="#4F46E5"/>
  <path d="M95 160 L120 185 L145 160 Z" fill="#3730A3" opacity="0.4"/>
  <path d="M105 160 L120 175 L135 160 Z" fill="url(#p1-skin)"/>

  <!-- Neck -->
  <rect x="110" y="135" width="20" height="28" rx="4" fill="url(#p1-skin)"/>

  <!-- Head -->
  <ellipse cx="120" cy="115" rx="36" ry="42" fill="url(#p1-skin)"/>

  <!-- Hair -->
  <path d="M84 105 C84 75, 100 65, 120 65 C145 65, 156 75, 156 100 C156 108, 152 115, 152 115 C148 90, 140 85, 120 85 C100 85, 92 95, 88 115 Z" fill="url(#p1-hair)"/>
  <path d="M84 100 C80 115, 85 125, 85 125 C88 115, 90 108, 90 100 Z" fill="url(#p1-hair)"/>

  <!-- Eyeglasses -->
  <rect x="94" y="105" width="20" height="15" rx="4" fill="none" stroke="#1E1B4B" stroke-width="3"/>
  <rect x="126" y="105" width="20" height="15" rx="4" fill="none" stroke="#1E1B4B" stroke-width="3"/>
  <line x1="114" y1="112" x2="126" y2="112" stroke="#1E1B4B" stroke-width="3"/>

  <!-- Smile -->
  <path d="M112 135 Q120 142 128 135" fill="none" stroke="#C2410C" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Modern Tech Badge Pin -->
  <circle cx="160" cy="180" r="14" fill="#06B6D4"/>
  <text x="160" y="185" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">&lt;/&gt;</text>
</svg>
