<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soucha</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand-link" href="/dishes" aria-label="Soucha, về thực đơn"><img src="/logo_and_name_sameline.svg" alt="Soucha"></a>
      <nav class="header-nav" aria-label="Điều hướng chính"><a href="/dishes">Thực đơn</a><a href="/admin/dishes">Quản lý</a></nav>
    </header>
    <main id="app">
      <p class="admin-count" role="status">Đang tải…</p>
      <noscript><p class="admin-count">Bật JavaScript để dùng thực đơn.</p></noscript>
    </main>
    <footer class="site-footer">
      <div class="footer-inner">
        <strong>SOUCHA TEA &amp; MATCHA</strong>
        <p>55 đường số 6, phường An Hội Đông, thành phố HCM</p>
        <p>Hotline/Zalo: <a href="tel:0865191634">0865191634</a></p>
        <p class="footer-hours">Thứ 2–Thứ 7 · 10:00–18:00</p>
      </div>
    </footer>
  </div>
  <script src="/vendor/axios.min.js"></script>
  <script>
    window.addEventListener('error', (event) => {
      if (event.target !== window) return;
      const root = document.getElementById('app');
      if (!root || root.dataset.ready) return;
      root.textContent = 'Không tải được ứng dụng.';
    });
  </script>
  <script type="module" src="/main.js"></script>
</body>
</html>
