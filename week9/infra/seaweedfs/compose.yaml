services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    command:
      - server
      - -ip=127.0.0.1
      - -ip.bind=0.0.0.0
      - -dir=/data
      - -filer
      - -s3
      - -s3.config=/run/secrets/s3.json
      - -s3.autoCreateBucket=false
      - -master.telemetry=false
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweed-data:/data
      - ./filer.toml:/etc/seaweedfs/filer.toml:ro
      - ${SEAWEED_S3_CONFIG:?Set SEAWEED_S3_CONFIG to an absolute path to your private S3 configuration}:/run/secrets/s3.json:ro
    restart: unless-stopped

volumes:
  seaweed-data:
